server {
    listen 3000;
    server_name _;
    root /app/www;

    location = /simulation/ {
        add_header Cache-Control "no-store" always;
        try_files /simulation/index.html =404;
    }

    location /simulation/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /simulation/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /simulation/index.html;
    }

    location / {
        return 404;
    }
}
